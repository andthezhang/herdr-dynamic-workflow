# fleet.toml for a real two-machine fleet: this laptop plus one ssh-reachable
# Mac. See docs/fleet.md for the full annotated reference.
#
#   herdr plugin action invoke herdrflow.engine.run -- "$PWD/skills/herdr-workflow-authoring/reference/fleet-hello.js" \
#     --cwd "$PWD" --fleet "$PWD/skills/herdr-workflow-authoring/reference/fleet.example.toml"

[defaults]
kind = "codex"
on_blocked = "fail"

[runtime.claude]
# Headless workers can never sit on a permission prompt.
permission = ["--dangerously-skip-permissions"]

[runtime.codex]
# codex 0.147.0 removed the old `--full-auto` alias (it is rejected as an
# unexpected argument). Its documented equivalent, verified against
# `codex --help`: workspace-write sandbox + never ask for approval.
permission = ["--sandbox", "workspace-write", "--ask-for-approval", "never"]

[runtime.codex.model]
"gpt-5.6-luna" = ["--model", "gpt-5.6-luna"]

# Declaring any [[machine]] makes the list authoritative — declare `local`
# too so local placement stays available (docs/fleet.md).

[[machine]]
name = "local"
slots = 2
kinds = ["claude", "codex"]

[[machine]]
name = "build-mac"
transport = "build-mac"                 # plain ssh alias from ~/.ssh/config (BatchMode works)
herdr_bin = "/opt/homebrew/bin/herdr"   # REQUIRED absolute path: ssh non-login shells have no PATH (SPEC D13)
slots = 2
kinds = ["claude", "codex"]             # both CLIs live at /Users/alex/.local/bin, on PATH inside pane shells
tags = ["mac", "arm64"]
